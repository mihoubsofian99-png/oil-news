<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>نشرة النفط</title>
<style>
  :root { --bg:#ECEFEF; --card:#fff; --ink:#111A1C; --muted:#566669; --line:#C9D2D3; --accent:#B04F08; --up:#1B7F4B; --down:#B3261E; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0E1517; --card:#152023; --ink:#E5ECEC; --muted:#93A5A8; --line:#2A3B3F; --accent:#F0A04B; --up:#6FD39A; --down:#FF8A80; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI",Tahoma,Arial,sans-serif; line-height:1.7; padding:20px 16px 40px; }
  .wrap { max-width:900px; margin:0 auto; display:flex; flex-direction:column; gap:20px; }
  header { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:flex-end; gap:6px; border-bottom:3px solid var(--accent); padding-bottom:10px; }
  h1 { margin:0; font-size:2.4rem; }
  #status { color:var(--muted); font-size:.9rem; }
  .prices { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px; background:var(--line); border:1px solid var(--line); }
  .card { background:var(--card); padding:14px 18px; }
  .card .name { color:var(--muted); font-size:.85rem; }
  .card .price { font-family:ui-monospace,Menlo,Consolas,monospace; font-size:2.2rem; font-weight:600; direction:ltr; text-align:right; }
  .card .chg { font-size:.9rem; font-weight:600; direction:ltr; text-align:right; }
  .up { color:var(--up); } .down { color:var(--down); }
  .flash { animation:flash 1.2s ease-out; }
  @keyframes flash { from { background:rgba(240,160,75,.35); } to { background:transparent; } }
  h2 { margin:0 0 6px; font-size:1.3rem; }
  ul { list-style:none; margin:0; padding:0; }
  li { padding:12px 0; border-top:1px solid var(--line); }
  li:first-child { border-top:0; }
  li a { color:var(--ink); text-decoration:none; font-weight:600; }
  li a:hover { color:var(--accent); text-decoration:underline; }
  .meta { color:var(--muted); font-size:.82rem; }
  .err { color:var(--down); font-size:.85rem; }
  .foot { color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>نشرة النفط</h1>
    <span id="status">جارٍ التحميل…</span>
  </header>
  <section class="prices" id="prices"></section>
  <section>
    <h2>آخر الأخبار</h2>
    <ul id="news"></ul>
  </section>
  <p class="err" id="errors"></p>
  <p class="foot">الأسعار من عقود آجلة قد تتأخر قليلًا، فاعتمد على منصة التداول عند التنفيذ. الأخبار عناوين وروابط لمصادرها، وليست نصيحة استثمارية.</p>
</div>
<script>
const LABELS = { WTI: "خام غرب تكساس WTI", BRENT: "خام برنت" };
const last = {};

function ago(ts) {
  if (!ts) return "";
  const m = Math.round((Date.now() / 1000 - ts) / 60);
  if (m < 1) return "الآن";
  if (m < 60) return "منذ " + m + " دقيقة";
  const h = Math.round(m / 60);
  if (h < 24) return "منذ " + h + " ساعة";
  return "منذ " + Math.round(h / 24) + " يوم";
}

function renderPrices(prices) {
  const box = document.getElementById("prices");
  box.replaceChildren();
  for (const key of ["WTI", "BRENT"]) {
    const p = prices[key];
    const card = document.createElement("div");
    card.className = "card";
    const name = document.createElement("div");
    name.className = "name";
    name.textContent = LABELS[key];
    const price = document.createElement("div");
    price.className = "price";
    const chg = document.createElement("div");
    chg.className = "chg";
    if (p) {
      price.textContent = p.price.toFixed(2);
      if (p.prev) {
        const d = p.price - p.prev;
        chg.textContent = (d >= 0 ? "▲ +" : "▼ ") + d.toFixed(2) + " (" + (d / p.prev * 100).toFixed(2) + "%)";
        chg.className = "chg " + (d >= 0 ? "up" : "down");
      }
      if (last[key] !== undefined && last[key] !== p.price) card.classList.add("flash");
      last[key] = p.price;
    } else {
      price.textContent = "—";
    }
    card.append(name, price, chg);
    box.append(card);
  }
}

function renderNews(news) {
  const ul = document.getElementById("news");
  ul.replaceChildren();
  for (const n of news) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = n.link; a.target = "_blank"; a.rel = "noopener";
    a.textContent = n.title;
    const meta = document.createElement("div");
    meta.className = "meta";
    meta.textContent = n.source + (n.ts ? " · " + ago(n.ts) : "");
    li.append(a, meta);
    ul.append(li);
  }
}

async function load() {
  const status = document.getElementById("status");
  try {
    const res = await fetch("/api/data", { cache: "no-store" });
    const d = await res.json();
    renderPrices(d.prices);
    renderNews(d.news);
    const errs = Object.entries(d.errors).map(([k, v]) => k + ": " + v);
    document.getElementById("errors").textContent = errs.length ? "تعذر جلب: " + errs.join(" | ") : "";
    status.textContent = "آخر تحديث: " + new Date().toLocaleTimeString("ar");
  } catch (e) {
    status.textContent = "تعذر الاتصال بالخادم";
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
